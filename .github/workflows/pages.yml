name: Deploy UIPod Web Simulator (GitHub Pages)

on:
  push:
    branches: ['main']
    paths:
      - 'VERSION'
      - 'pak.json'
      - 'web/**'
      - 'crates/uipod-ui/**'
      - 'crates/uipod-plugin-sdk/**'
      - 'plugins/**'
      - 'assets/fonts/**'
      - 'pak/uipod/about.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: Build & Deploy Web Simulator (gh-pages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust & wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Cache Rust WASM build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'web/uipod-wasm -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build UIPod WASM & Vite site
        run: |
          export UIPOD_VERSION="$(tr -d '[:space:]' < VERSION)"
          npm --prefix web ci
          chmod +x ./web/build.sh
          ./web/build.sh
          touch web/dist/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
          publish_branch: gh-pages
          force_orphan: true
