name: Deploy UIPod Web Simulator (GitHub Pages)

on:
  push:
    branches: ['main']
    paths:
      - 'VERSION'
      - 'pak.json'
      - 'web/**'
      - 'crates/uipod-ui/**'
      - 'crates/uipod-plugin-sdk/**'
      - 'plugins/**'
      - 'assets/fonts/**'
      - 'pak/uipod/about.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-pages:
    name: Build Web Page & WASM Simulator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust & wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Cache Rust WASM build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'web/uipod-wasm -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build UIPod WASM & Vite site
        run: |
          export UIPOD_VERSION="$(tr -d '[:space:]' < VERSION)"
          npm --prefix web ci
          chmod +x ./web/build.sh
          ./web/build.sh
          touch web/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
