# Builds all UIPod targets in parallel and publishes a versioned GitHub Release +
# updates the live GitHub Pages WebAssembly simulator & landing page on every release:
#   - UIPod.pak.zip                    (NextUI Pak Store format, matches pak.json release_filename)
#   - UIPod-<tag>-brick.zip            (ready-to-extract UIPod.pak/ folder for /mnt/SDCARD/Tools/tg5040/)
#   - UIPod-<tag>-android-arm64.apk    (signed Android 8.0+ arm64-v8a handheld app)
#   - UIPod-<tag>-web.zip              (self-hosted WebAssembly + WebGL2 simulator & landing bundle)
#   - GitHub Pages deployment          (live web landing page + WASM simulator stamped with <tag>)
#
# Triggered either by:
#   1) Pushing any `v*` tag (`git tag v0.6.0 && git push origin v0.6.0`), OR
#   2) Clicking "Run workflow" in GitHub Actions (auto-bumps VERSION + pak.json + web/package.json,
#      creates the tag on `main`, builds all apps + web page, and publishes Release + GitHub Pages).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (used when explicit tag is empty)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      tag:
        description: 'Explicit version tag override (e.g. v0.6.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve or bump release version
        id: ver
        env:
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            TARGET="${INPUT_TAG:-$INPUT_BUMP}"
            chmod +x ./scripts/bump-version.sh
            ./scripts/bump-version.sh "$TARGET"
            RELEASE_TAG="$(tr -d '[:space:]' < VERSION)"
            git add VERSION pak.json web/package.json pak/uipod/about.txt README.md
            if ! git diff --cached --quiet; then
              git commit -m "chore(release): ${RELEASE_TAG}"
              git push origin HEAD:main
            fi
            if ! git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
              git tag -a "$RELEASE_TAG" -m "UIPod ${RELEASE_TAG}"
              git push origin "$RELEASE_TAG"
            fi
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo ">> Building release version: ${RELEASE_TAG}"

  build-tg5040:
    name: Build TrimUI Brick App (.pak)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & cache tg5040 + Rust toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.uipod
          tags: uipod-toolchain:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Rust workspace unit tests
        run: |
          mkdir -p build-uipod/.cargo-cache
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e CARGO_HOME=/build/build-uipod/.cargo-cache \
            -v "$PWD":/build -w /build uipod-toolchain:latest \
            bash -lc "export PATH=/opt/cargo/bin:\$PATH; cargo test --locked --workspace --lib"

      - name: Build & package UIPod for TrimUI Brick
        env:
          UIPOD_VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          ./build.sh
          ./package.sh

      - name: Verify stamped pak.json version matches tag
        env:
          EXPECTED_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 - "$EXPECTED_TAG" <<'PY'
          import json, sys, zipfile
          expected = sys.argv[1]
          with zipfile.ZipFile("dist/UIPod.pak.zip") as zf:
              meta = json.loads(zf.read("pak.json").decode("utf-8"))
          actual = meta.get("version")
          print(f"pak.json version={actual!r}, tag={expected!r}, release_filename={meta.get('release_filename')!r}")
          assert actual == expected, f"pak.json version ({actual}) != tag ({expected})"
          assert meta.get("release_filename") == "UIPod.pak.zip"
          PY

      - name: Upload TrimUI Brick release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-tg5040
          path: |
            dist/UIPod.pak.zip
            dist/UIPod-*-brick.zip
          if-no-files-found: error

  build-android:
    name: Build Android App (arm64-v8a APK)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Rust & Android arm64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust cargo artifacts (Android)
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Cache Android SDK/NDK/SDL2/OpenSSL toolchain
        uses: actions/cache@v4
        with:
          path: build-android/.toolchain
          key: uipod-android-tc-v1-${{ runner.os }}

      - name: Build & sign UIPod Android APK (arm64-v8a)
        env:
          UIPOD_VERSION: ${{ needs.prepare.outputs.tag }}
          ANDROID_HOME: ${{ github.workspace }}/build-android/.toolchain/android-sdk
          UIPOD_KEYSTORE_BASE64: ${{ secrets.UIPOD_KEYSTORE_BASE64 }}
          UIPOD_KEY_ALIAS: ${{ secrets.UIPOD_KEY_ALIAS }}
          UIPOD_KEYSTORE_PASS: ${{ secrets.UIPOD_KEYSTORE_PASS }}
          UIPOD_KEY_PASS: ${{ secrets.UIPOD_KEY_PASS }}
        run: |
          chmod +x ./build-android.sh
          ./build-android.sh

      - name: Upload Android APK release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/UIPod-*-android-arm64.apk
          if-no-files-found: error

  build-web:
    name: Build Web Page & WASM Simulator
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Rust & wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.13.1'

      - name: Cache Rust WASM build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'web/uipod-wasm -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build UIPod WASM simulator & Vite web page
        env:
          UIPOD_VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          npm --prefix web ci
          chmod +x ./web/build.sh
          ./web/build.sh
          touch web/dist/.nojekyll
          mkdir -p dist
          SAFE_VER="$(printf '%s' "$UIPOD_VERSION" | sed 's/[^A-Za-z0-9._+-]/-/g')"
          (cd web/dist && zip -qr "../../dist/UIPod-${SAFE_VER}-web.zip" .)

      - name: Upload Web bundle release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: dist/UIPod-*-web.zip
          if-no-files-found: error

      - name: Upload built web/dist for Pages deploy
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: web/dist
          include-hidden-files: true
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [prepare, build-tg5040, build-android, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate concise release changelog
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 - "$RELEASE_TAG" "/tmp/release-notes.md" <<'PY'
          import json, re, subprocess, sys

          tag, out_path = sys.argv[1], sys.argv[2]
          notes = ""
          try:
              with open("pak.json", "r", encoding="utf-8") as f:
                  meta = json.load(f)
              entry = (meta.get("changelog") or {}).get(tag, "").strip()
              if entry and not entry.startswith("Release "):
                  notes = entry
          except Exception:
              pass

          if not notes:
              tags = subprocess.check_output(
                  ["git", "tag", "--sort=-creatordate", "-l", "v*"],
                  text=True,
              ).splitlines()
              prev = next((t.strip() for t in tags if t.strip() and t.strip() != tag), "")
              cmd = ["git", "log", "--no-merges", "--pretty=format:%s"]
              cmd.append(f"{prev}..{tag}" if prev else "-n")
              if not prev:
                  cmd.append("6")
              raw = subprocess.check_output(cmd, text=True).splitlines()
              bullets = []
              seen = set()
              for line in raw:
                  s = line.strip()
                  if not s or re.match(r"^chore\(release\):", s, re.I):
                      continue
                  s = re.sub(r"^[a-z]+(\([^)]+\))?!?:\s*", "", s, flags=re.I)
                  s = re.sub(r"\s*\(v\d+\.\d+\.\d+\)\s*$", "", s)
                  if s:
                      s = s[0].upper() + s[1:]
                      if s.lower() not in seen:
                          seen.add(s.lower())
                          bullets.append(f"- {s}")
                  if len(bullets) >= 6:
                      break
              notes = "\n".join(bullets) if bullets else f"- UIPod {tag} release for TrimUI Brick, Android & Web"

          with open(out_path, "w", encoding="utf-8") as out:
              out.write("### What's Changed\n\n" + notes + "\n")
          print(open(out_path, "r", encoding="utf-8").read())
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          SAFE_VER="$(printf '%s' "$RELEASE_TAG" | sed 's/[^A-Za-z0-9._+-]/-/g')"
          BRICK_ZIP="dist/UIPod-${SAFE_VER}-brick.zip"
          ANDROID_APK="dist/UIPod-${SAFE_VER}-android-arm64.apk"
          WEB_ZIP="dist/UIPod-${SAFE_VER}-web.zip"
          ls -lh dist/
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "UIPod ${RELEASE_TAG}" \
              --notes-file /tmp/release-notes.md
            gh release upload "$RELEASE_TAG" \
              dist/UIPod.pak.zip \
              "$BRICK_ZIP" \
              "$ANDROID_APK" \
              "$WEB_ZIP" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/UIPod.pak.zip \
              "$BRICK_ZIP" \
              "$ANDROID_APK" \
              "$WEB_ZIP" \
              --title "UIPod ${RELEASE_TAG}" \
              --notes-file /tmp/release-notes.md
          fi

  deploy-pages:
    name: Deploy Web Page (gh-pages)
    needs: [prepare, build-web, publish-release]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Download built web/dist
        uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: web/dist

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'chore(pages): deploy UIPod ${{ needs.prepare.outputs.tag }}'
