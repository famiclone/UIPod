name: Build UIPod (Brick, Android & Web)

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tg5040:
    name: Build UIPod.pak (TrimUI Brick / tg5040)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & cache tg5040 + Rust toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.uipod
          tags: uipod-toolchain:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Rust workspace unit tests
        run: |
          mkdir -p build-uipod/.cargo-cache
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e CARGO_HOME=/build/build-uipod/.cargo-cache \
            -v "$PWD":/build -w /build uipod-toolchain:latest \
            bash -lc "export PATH=/opt/cargo/bin:\$PATH; cargo test --locked --workspace --lib"

      - name: Cross-compile UIPod for TrimUI Brick (tg5040)
        run: |
          BASE_VER="$(tr -d '[:space:]' < VERSION)"
          export UIPOD_VERSION="${BASE_VER}-${GITHUB_SHA::7}"
          ./build.sh
          ./package.sh

      - name: Upload TrimUI Brick pak artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UIPod-tg5040-${{ github.sha }}
          path: |
            dist/UIPod.pak.zip
            dist/UIPod-*-brick.zip
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build UIPod APK (Android / arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Rust & Android arm64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust cargo artifacts (Android)
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Cache Android SDK/NDK/SDL2/OpenSSL toolchain
        uses: actions/cache@v4
        with:
          path: build-android/.toolchain
          key: uipod-android-tc-v1-${{ runner.os }}

      - name: Build & sign UIPod Android APK (arm64-v8a)
        env:
          ANDROID_HOME: ${{ github.workspace }}/build-android/.toolchain/android-sdk
        run: |
          BASE_VER="$(tr -d '[:space:]' < VERSION)"
          export UIPOD_VERSION="${BASE_VER}-${GITHUB_SHA::7}"
          chmod +x ./build-android.sh
          ./build-android.sh

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UIPod-android-arm64-${{ github.sha }}
          path: dist/UIPod-*-android-arm64.apk
          if-no-files-found: error
          retention-days: 30

  build-web:
    name: Build Web Page & WASM Simulator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust & wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.13.1'

      - name: Cache Rust WASM build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'web/uipod-wasm -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build UIPod WASM & Vite site
        run: |
          BASE_VER="$(tr -d '[:space:]' < VERSION)"
          export UIPOD_VERSION="${BASE_VER}"
          npm --prefix web ci
          chmod +x ./web/build.sh
          ./web/build.sh
          touch web/dist/.nojekyll

      - name: Upload Web Simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: UIPod-web-${{ github.sha }}
          path: web/dist
          if-no-files-found: error
          retention-days: 30
