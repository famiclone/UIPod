# UIPod default config — auto-applies the 1ST_GEN_REMIX theme on first boot.
# Loaded by Rockbox at startup as ROCKBOX_DIR/config.cfg (/tmp/uipod/config.cfg).
# Paths are pre-resolved to the live bind-mount path (/tmp/uipod).
wps: -
sbs: /tmp/uipod/wps/1ST_GEN_REMIX.sbs
font: /tmp/uipod/fonts/76-Geologica.fnt
volume_ddb: -220
selector type: bar (inverse)
backdrop: -
background color: D6D8D5
foreground color: 3C3637
foreground color 1: A8A8A8
foreground color 2: 595959
statusbar: off
scrollbar: right
iconset: -
viewers iconset: -
show icons: off
brightness: 3
idle poweroff: 0
backlight timeout: 20
viz start delay: 10
