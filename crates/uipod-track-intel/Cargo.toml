[package]
name = "uipod-track-intel"
version = "0.1.0"
edition = "2021"
description = "Unified Track Intelligence engine: persistent binary BPM/spectral DB + lock-free real-time audio telemetry"
license = "GPL-2.0-or-later"

[lib]
name = "uipod_track_intel"
crate-type = ["rlib"]

[dependencies]
crc32fast = "1.5"
uipod-nsf = { path = "../uipod-nsf" }
uipod-codecs = { path = "../uipod-codecs" }
uipod-plugin-sdk = { path = "../uipod-plugin-sdk" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
symphonia = { version = "0.5", default-features = false, features = [
    "mp3",
    "flac",
    "ogg",
    "vorbis",
    "pcm",
    "wav",
    "aiff",
    "isomp4",
    "aac",
    "alac",
] }
