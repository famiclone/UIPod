[package]
name = "uipod-ui"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust GPU UI engine for UIPod (taffy + femtovg on OpenGL ES 3.0)"
license = "GPL-2.0-or-later"

[lib]
name = "uipod_ui"
crate-type = ["rlib"]

[dependencies]
taffy = { version = "0.7", default-features = false, features = ["std", "flexbox", "taffy_tree"] }
femtovg = { version = "0.10", default-features = false }
glow = { version = "0.15", default-features = false }
imgref = "1.12"
rgb = "0.8"
png = "0.17"
zune-jpeg = "0.5"
uipod-track-intel = { path = "../uipod-track-intel" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlContextAttributes",
] }
